<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Horse Kampung kubur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0d11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 600px;
            background: #2d5a27;
            border: 3px solid #ffcc00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }
        .wanted-stars { color: #ffcc00; letter-spacing: 2px; }
        .score-box { color: #2ecc71; font-family: monospace; font-size: 16px; }

        /* Mobile Controls */
        .controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(2, 45px);
            gap: 5px;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }
        .btn-act {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e74c3c;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.8);
        }

        /* Modal Landing Page / Link Bio */
        #portal-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
        }
        .portal-card {
            background: #181824;
            border: 2px solid #ffcc00;
            padding: 25px 20px;
            border-radius: 12px;
            width: 90%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
        }
        .portal-title {
            color: #ffcc00;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .portal-desc { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .btn-portal {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
        }
        .btn-play { background: #27ae60; color: #fff; border: none; cursor: pointer; }
        .btn-link { background: #e74c3c; color: #fff; }
        .btn-wa { background: #25d366; color: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="wanted-stars">WANTED: ★☆☆☆☆</div>
        <div class="score-box">$<span id="score">0000</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Controls untuk HP -->
    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn-ctrl" id="btnUp">▲</div><div></div>
            <div class="btn-ctrl" id="btnLeft">◄</div>
            <div class="btn-ctrl" id="btnDown">▼</div>
            <div class="btn-ctrl" id="btnRight">►</div>
        </div>
        <button class="btn-ctrl btn-act" id="btnGallop">🐎</button>
    </div>

    <!-- Tampilan Pop-up / Redirection Link -->
    <div id="portal-modal">
        <div class="portal-card" id="OMEK02">
            <div class="portal-title">🐎 Udah Dia Itu 🐎</div>
            <div class="portal-desc">Kendalikan Kuda di Kampung Kubur Kumpulkan Koin & Hindari Mobil Polisi!</div>
            
            <button class="btn-portal btn-play" onclick="startGame()">MAIN GAME</button>
            <a href="https://link-login-game-anda.com" class="btn-portal btn-link" target="_blank">LOGIN RESMI</a>
            <a href="https://wa.me/6281234567890" class="btn-portal btn-wa" target="_blank">LIVECHAT WA</a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let score = 0;

    const player = { x: 185, y: 450, speed: 4 };
    const keys = { Up: false, Down: false, Left: false, Right: false };
    let coins = [], cops = [];

    function spawnElements() {
        if (coins.length < 4) {
            coins.push({ x: Math.random() * 200 + 100, y: Math.random() * 400 + 50, radius: 8 });
        }
        if (cops.length < 2) {
            cops.push({ x: Math.random() * 200 + 100, y: -50, speed: 3 + Math.random() * 2 });
        }
    }

    const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindBtn('btnUp', 'Up'); bindBtn('btnDown', 'Down');
    bindBtn('btnLeft', 'Left'); bindBtn('btnRight', 'Right');

    document.getElementById('btnGallop').addEventListener('touchstart', (e) => {
        e.preventDefault(); player.speed = 8;
        setTimeout(() => player.speed = 4, 800);
    });

    function startGame() {
        document.getElementById('portal-modal').style.display = 'none';
        isPlaying = true;
        gameLoop();
    }

    function update() {
        if (!isPlaying) return;
        if (keys.Up && player.y > 50) player.y -= player.speed;
        if (keys.Down && player.y < canvas.height - 80) player.y += player.speed;
        if (keys.Left && player.x > 90) player.x -= player.speed;
        if (keys.Right && player.x < 280) player.x += player.speed;

        spawnElements();

        coins.forEach((coin, index) => {
            if (Math.hypot(player.x - coin.x, player.y - coin.y) < 25) {
                coins.splice(index, 1);
                score += 100;
                document.getElementById('score').innerText = score.toString().padStart(4, '0');
            }
        });

        cops.forEach((cop) => {
            cop.y += cop.speed;
            if (cop.y > canvas.height) { cop.y = -50; cop.x = Math.random() * 200 + 100; }
            if (Math.hypot(player.x - cop.x, player.y - cop.y) < 25) {
                alert('TERTANGKAP POLISI! Skor: $' + score);
                score = 0;
                document.getElementById('score').innerText = '0000';
                document.getElementById('portal-modal').style.display = 'flex';
                isPlaying = false;
            }
        });
    }

    function draw() {
        ctx.fillStyle = '#2d5a27'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Rumput
        ctx.fillStyle = '#444'; ctx.fillRect(80, 0, 240, canvas.height); // Jalan raya KAMPUNG KUBUR

        // Garis Jalan
        ctx.strokeStyle = '#fff'; ctx.setLineDash([20, 20]);
        ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, canvas.height); ctx.stroke();

        // Koin
        ctx.fillStyle = '#ffcc00';
        coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill(); });

        // Mobil Polisi
        cops.forEach(cop => {
            ctx.fillStyle = '#1e3799'; ctx.fillRect(cop.x - 12, cop.y - 20, 24, 40);
            ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#e74c3c' : '#3498db';
            ctx.fillRect(cop.x - 8, cop.y - 4, 16, 8);
        });

        // Player Kuda 🐎
        ctx.font = '28px Serif';
        ctx.fillText('🐎', player.x - 14, player.y + 10);
    }

    function gameLoop() {
        update(); draw();
        if (isPlaying) requestAnimationFrame(gameLoop);
    }
    draw();
</script>
</body>
</html>
